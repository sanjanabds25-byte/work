
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            color: #222;
            padding: 30px 15px;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #fffdf8;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 8px;
            color: #202b40;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #2453d4;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            font-size: 13px;
            font-weight: bold;
        }

        .calculate {
            background: #2453d4;
        }

        .calculate:hover {
            background: #173ca7;
        }

        .reset {
            background: #202b40;
        }

        .reset:hover {
            background: #101827;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 15px;
            border-left: 4px solid #2453d4;
            background: #f8f9fc;
            line-height: 1.9;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        #result h3 {
            margin-bottom: 8px;
        }

        .grade {
            font-size: 18px;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 25px;
        }

        @media (max-width: 400px) {
            .container {
                padding: 18px;
            }

            h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Grade Calculator</h1>
    <p class="subtitle">Enter marks out of 100 for each subject</p>

    <form id="gradeForm">

        <div class="form-group">
            <label for="studentName">Student Name</label>
            <input type="text" id="studentName"
                   placeholder="Enter student name" required>
        </div>

        <div class="form-group">
            <label for="web">Web Fundamentals</label>
            <input type="number" id="web" min="0" max="100"
                   placeholder="Enter marks" required>
        </div>

        <div class="form-group">
            <label for="python">Python Programming</label>
            <input type="number" id="python" min="0" max="100"
                   placeholder="Enter marks" required>
        </div>

        <div class="form-group">
            <label for="ds">Data Structures</label>
            <input type="number" id="ds" min="0" max="100"
                   placeholder="Enter marks" required>
        </div>

        <div class="form-group">
            <label for="maths">Mathematics</label>
            <input type="number" id="maths" min="0" max="100"
                   placeholder="Enter marks" required>
        </div>

        <div class="form-group">
            <label for="constitution">Indian Constitution</label>
            <input type="number" id="constitution" min="0" max="100"
                   placeholder="Enter marks" required>
        </div>

        <div class="buttons">
            <button type="submit" class="calculate">
                Calculate
            </button>

            <button type="reset" class="reset">
                Reset
            </button>
        </div>

    </form>

    <div id="result" aria-live="polite"></div>

    <p class="footer">Student Grade Calculator</p>

</div>

<script>
    const form = document.getElementById("gradeForm");
    const result = document.getElementById("result");

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const name = document.getElementById("studentName")
                              .value.trim();

        const subjects = [
            Number(document.getElementById("web").value),
            Number(document.getElementById("python").value),
            Number(document.getElementById("ds").value),
            Number(document.getElementById("maths").value),
            Number(document.getElementById("constitution").value)
        ];

        if (name === "") {
            alert("Please enter student name.");
            return;
        }

        if (subjects.some(mark => !Number.isFinite(mark) ||
            mark < 0 || mark > 100)) {
            alert("Please enter marks between 0 and 100.");
            return;
        }

        const total = subjects.reduce((sum, mark) => sum + mark, 0);
        const percentage = total / 5;

        let grade;
        let gradeDescription;

        if (percentage >= 90) {
            grade = "O";
            gradeDescription = "Outstanding";
        } else if (percentage >= 80) {
            grade = "A+";
            gradeDescription = "Excellent";
        } else if (percentage >= 70) {
            grade = "A";
            gradeDescription = "Very Good";
        } else if (percentage >= 60) {
            grade = "B";
            gradeDescription = "Good";
        } else if (percentage >= 50) {
            grade = "C";
            gradeDescription = "Average";
        } else if (percentage >= 40) {
            grade = "D";
            gradeDescription = "Pass";
        } else {
            grade = "F";
            gradeDescription = "Fail";
        }

        const passed = subjects.every(mark => mark >= 40);

        result.style.display = "block";

        result.innerHTML = `
            <h3>Result</h3>
            <p><strong>Student:</strong> ${escapeHTML(name)}</p>
            <p><strong>Total:</strong> ${total} / 500</p>
            <p><strong>Percentage:</strong> ${percentage.toFixed(2)} %</p>
            <p class="grade"><strong>Grade:</strong>
                ${grade} (${gradeDescription})</p>
            <p><strong>Result:</strong> ${passed ? "PASS" : "FAIL"}</p>
        `;
    });

    function escapeHTML(value) {
        return value.replace(/[&<>"']/g, function(char) {
            const entities = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            };
            return entities[char];
        });
    }

    form.addEventListener("reset", function() {
        result.style.display = "none";
        result.innerHTML = "";
    });
</script>

</body>
</html>
